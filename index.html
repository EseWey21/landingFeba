<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--head-meta-->
    <meta name="theme-color" content="#1A1F36" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      /* Antes del primer pintado: fija el tema y marca que hay JS. Si la app no
         carga en 4 s, se muestran los bloques que esperan su animación de entrada. */
      (function () {
        var d = document.documentElement
        var t
        try { t = localStorage.getItem("theme") } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        d.setAttribute("data-theme", t)
        d.classList.add("js")
        setTimeout(function () {
          if (!window.__appReady) d.classList.add("reveal-fallback")
        }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
